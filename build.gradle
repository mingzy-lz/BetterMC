plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.+'
}

base {
	group = project.group + "." + project.mod_id
	archivesName = project.mod_id + '-fabric-' + project.minecraft_version
	version = project.mod_version
}

repositories {
	maven {
		url = "https://masa.dy.fi/maven/sakura-ryoko"
		content { includeGroupAndSubgroups("fi.dy.masa") }
	}
	maven {
		url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// MaLiLib (前置模组) - 本地 libs 目录
	implementation files("libs/malilib-fabric-${project.minecraft_version}-${project.malilib_version}.jar")
}

processResources {
	inputs.property "mod_version", project.mod_version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "fabric_loader_version", project.fabric_loader_version
	inputs.property "malilib_version", project.malilib_version

	filesMatching("fabric.mod.json") {
		expand "mod_version"          : project.mod_version,
			   "minecraft_version"    : project.minecraft_version,
			   "fabric_loader_version": project.fabric_loader_version,
			   "malilib_version"      : project.malilib_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	// Minecraft 26.1+ uses Java 25
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
